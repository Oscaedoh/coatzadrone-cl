<!doctype html><html lang="es"><head><meta charset="utf-8"><title>perfil-a</title>
<style>
html,body{margin:0;padding:0;width:1000px;height:1000px;overflow:hidden;background:#060E1A}
.c{position:relative;width:1000px;height:1000px;overflow:hidden;
   background:radial-gradient(115% 115% at 50% 30%, #1B3A5C 0%, #0E2440 42%, #071224 72%, #040B14 100%);
   font-family:'Century Gothic','Segoe UI',sans-serif;}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:50px 50px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 72%);}
.ring{position:absolute;border-radius:50%;}
.r1{inset:26px;border:2px solid rgba(255,255,255,.14)}
.r2{inset:46px;border:1px dashed rgba(255,255,255,.10)}
.stack{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:0}

.wm{width:748px;display:block}
.sep{display:flex;align-items:center;gap:24px;margin-top:54px}
.sep i{display:block;width:126px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55))}
.sep i.r{background:linear-gradient(90deg,rgba(255,255,255,.55),transparent)}
.chile{font-size:54px;letter-spacing:.30em;color:#fff;font-weight:700;
       text-indent:.30em;line-height:1}
.star{width:46px;height:46px;fill:#fff}
</style></head><body><div class="c">
<div class="grid"></div>
<div class="ring r1"></div><div class="ring r2"></div>
<svg width="1000" height="1000" style="position:absolute;inset:0">
  <path d="M735 907 A470 470 0 0 1 581.6 962.9" fill="none" stroke="#D32A1E" stroke-width="9"/>
  <path d="M581.6 962.9 A470 470 0 0 1 418.4 962.9" fill="none" stroke="#FFFFFF" stroke-width="9"/>
  <path d="M418.4 962.9 A470 470 0 0 1 265 907" fill="none" stroke="#0B4DA2" stroke-width="9"/>
</svg>
<div class="stack">
  <img class="wm" src="logo-wordmark-blanco.svg">
  <div class="sep">
    <i></i>
    <svg class="star" viewBox="0 0 24 24"><path d="M12 1.6l2.94 6.42 7.06.79-5.26 4.74 1.45 6.93L12 16.9l-6.19 3.58 1.45-6.93L2 8.81l7.06-.79z"/></svg>
    <i class="r"></i>
  </div>
  <div class="chile" style="margin-top:28px">CHILE</div>
</div>
</div></body></html>
